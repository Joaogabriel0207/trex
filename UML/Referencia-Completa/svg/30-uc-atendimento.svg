"><ellipse cx="368.2395" cy="399.3909" fill="#EDF5FC" rx="123.3919" ry="27.0784" style="stroke:#527490;stroke-width:0.5;"/><text fill="#17283A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="177.4131" x="279.533" y="395.2522">Consultar mesas e consumo</text><text fill="#17283A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="188.3369" x="274.0711" y="410.8929">de comandas em atendimento</text></g><!--entity Abrir--><g class="entity" data-entity="Abrir" data-source-line="34" data-uid="ent0008" id="entity_Abrir"><ellipse cx="368.1615" cy="540.2753" fill="#EDF5FC" rx="97.8138" ry="21.9628" style="stroke:#527490;stroke-width:0.5;"/><text fill="#17283A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="172.751" x="281.786" y="544.5956">Abrir comanda para a mesa</text></g><!--entity Menu--><g class="entity" data-entity="Menu" data-source-line="35" data-uid="ent0009" id="entity_Menu"><ellipse cx="368.3439" cy="619.334" fill="#EDF5FC" rx="85.9962" ry="24.5215" style="stroke:#527490;stroke-width:0.5;"/><text fill="#17283A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="106.5928" x="315.0475" y="614.9768">Consultar e filtrar</text><text fill="#17283A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="120.6338" x="308.027" y="630.6174">card&#225;pio dispon&#237;vel</text></g><!--entity Ras--><g class="entity" data-entity="Ras" data-source-line="36" data-uid="ent0010" id="entity_Ras"><ellipse cx="368.5649" cy="316.3789" fill="#EDF5FC" rx="105.7173" ry="24.0664" style="stroke:#527490;stroke-width:0.5;"/><text fill="#17283A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="119.0479" x="309.041" y="311.3509">Montar, retomar ou</text><text fill="#17283A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="152.5234" x="292.3032" y="326.9915">descartar rascunho local</text></g><!--entity Enviar--><g class="entity" data-entity="Enviar" data